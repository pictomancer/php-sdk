name: Notify Packagist

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist update
        run: |
          curl -sS -XPOST "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/pictomancer/php-sdk"}}'
